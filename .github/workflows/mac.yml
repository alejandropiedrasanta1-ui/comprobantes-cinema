name: Compilar para Mac

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mac:
    name: Mac ${{ matrix.arq }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.opcional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon (M1, M2, M3, M4…)
            arq: Apple Silicon
            opcional: false
          - runner: macos-15-intel     # Mac con procesador Intel (si GitHub aún lo ofrece)
            arq: Intel
            opcional: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip PySide6 PySide6-Fluent-Widgets Pillow pyinstaller dmgbuild

      - name: Compilar la ventana del instalador (Swift)
        run: |
          swiftc --version
          swiftc -swift-version 5 -O -parse-as-library -target arm64-apple-macos13.0 empaquetar/mac/instalador_mac.swift -o "$RUNNER_TEMP/instalar_prueba"

      - name: Probar la interfaz desde el código
        run: python generador.py --verificar

      - name: Compilar la app
        working-directory: empaquetar
        run: python -m PyInstaller --noconfirm --clean --distpath dist-mac --workpath build-mac comprobantes.spec

      - name: Probar la app compilada
        run: '"empaquetar/dist-mac/Comprobantes Cinema.app/Contents/MacOS/Comprobantes Cinema" --verificar'

      - name: Capturas de pantalla
        continue-on-error: true
        run: '"empaquetar/dist-mac/Comprobantes Cinema.app/Contents/MacOS/Comprobantes Cinema" --capturas "$PWD/capturas"'

      - name: Crear el instalador (.dmg con ventana nativa, como CineSlide)
        run: |
          chmod +x empaquetar/crear_instalador_mac.sh
          PYTHON=python empaquetar/crear_instalador_mac.sh "$PWD/empaquetar/dist-mac/Comprobantes Cinema.app" "$PWD/salida"
          ls -lh salida

      - uses: actions/upload-artifact@v7
        with:
          name: instalador-mac-${{ runner.arch }}
          path: salida/*.dmg
          retention-days: 30

      - name: Probar el instalador como lo haría el usuario
        timeout-minutes: 8
        run: |
          set -x
          mkdir -p capturas
          DMG=$(ls salida/*.dmg | head -1)
          # 1) doble clic en el .dmg: ventana «Doble clic para instalar»
          open "$DMG"
          MNT=""
          for i in $(seq 1 90); do MNT=$(ls -d /Volumes/Comprobantes* 2>/dev/null | head -1); [ -n "$MNT" ] && break; sleep 1; done
          echo "montado en: $MNT"
          ls -la "$MNT"
          sleep 6
          screencapture -x capturas/5_ventana_del_dmg.png || true
          INST="$MNT/Instalar Comprobantes.app/Contents/MacOS/instalar"
          # 2) la ventana del instalador en modo demostración (diseño, sin instalar nada)
          "$INST" --demo & DEMO=$!
          sleep 2.4; screencapture -x capturas/6a_instalador_pasos.png || true
          sleep 3.6; screencapture -x capturas/6b_instalador_listo.png || true
          kill $DEMO || true
          "$INST" --demo-error & DEMO=$!
          sleep 5.5; screencapture -x capturas/6c_instalador_error.png || true
          kill $DEMO || true
          sleep 1
          # 3) la instalación de verdad: doble clic en «Instalar Comprobantes»
          ( sleep 1.5; screencapture -x capturas/6d_instalando.png ) &
          open -W "$MNT/Instalar Comprobantes.app"
          sleep 6
          test -d "/Applications/Comprobantes Cinema.app" && echo "OK: instalado en Aplicaciones"
          defaults read com.apple.dock persistent-apps | grep -i "comprobantes" && echo "OK: está en el Dock"
          pgrep -f "Comprobantes Cinema.app/Contents/MacOS" && echo "OK: el programa se abrió"
          screencapture -x capturas/7_instalado_y_abierto.png || true
          sleep 3
          if [ -d "$MNT" ]; then echo "AVISO: el disco sigue montado"; else echo "OK: el disco se expulsó"; fi
          pkill -f "Comprobantes Cinema.app/Contents/MacOS" || true
          sleep 3
          screencapture -x capturas/8_dock_con_programa_cerrado.png || true
          # 4) volver a abrir el instalador con la misma versión ya instalada: solo abre el programa
          hdiutil attach "$DMG" -nobrowse
          MNT=$(ls -d /Volumes/Comprobantes* | head -1)
          open -W "$MNT/Instalar Comprobantes.app"
          sleep 4
          pgrep -f "Comprobantes Cinema.app/Contents/MacOS" && echo "OK: ya instalado → solo lo abrió"
          pkill -f "Comprobantes Cinema.app/Contents/MacOS" || true
          hdiutil detach "$MNT" -force || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capturas-mac-${{ runner.arch }}
          path: capturas/*.png
          retention-days: 30
