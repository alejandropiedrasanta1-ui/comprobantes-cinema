name: Compilar para Mac

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mac:
    name: Mac ${{ matrix.arq }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.opcional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon (M1, M2, M3, M4…)
            arq: Apple Silicon
            opcional: false
          - runner: macos-15-intel     # Mac con procesador Intel (si GitHub aún lo ofrece)
            arq: Intel
            opcional: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip PySide6 PySide6-Fluent-Widgets Pillow pyinstaller

      - name: Probar la interfaz desde el código
        run: python generador.py --verificar

      - name: Compilar la app
        working-directory: empaquetar
        run: python -m PyInstaller --noconfirm --clean --distpath dist-mac --workpath build-mac comprobantes.spec

      - name: Probar la app compilada
        run: '"empaquetar/dist-mac/Comprobantes Cinema.app/Contents/MacOS/Comprobantes Cinema" --verificar'

      - name: Capturas de pantalla
        continue-on-error: true
        run: '"empaquetar/dist-mac/Comprobantes Cinema.app/Contents/MacOS/Comprobantes Cinema" --capturas "$PWD/capturas"'

      - name: Crear el instalador de un clic (.dmg)
        run: |
          chmod +x empaquetar/crear_instalador_mac.sh
          empaquetar/crear_instalador_mac.sh "$PWD/empaquetar/dist-mac/Comprobantes Cinema.app" "$PWD/salida"
          ls -lh salida

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-mac-${{ runner.arch }}
          path: salida/*.dmg
          retention-days: 30

      - name: Probar el instalador como lo haría el usuario
        run: |
          set -x
          DMG=$(ls salida/*.dmg | head -1)
          hdiutil attach "$DMG" -nobrowse
          ls "/Volumes/Comprobantes Cinema"
          ( sleep 1.5; screencapture -x "$PWD/capturas/6a_instalando.png"; sleep 1.5; screencapture -x "$PWD/capturas/6b_instalando.png" ) &
          open -W "/Volumes/Comprobantes Cinema/Instalar Comprobantes Cinema.app"
          sleep 6
          test -d "/Applications/Comprobantes Cinema.app" && echo "OK: instalado en Aplicaciones"
          defaults read com.apple.dock persistent-apps | grep -i "comprobantes" && echo "OK: está en el Dock"
          pgrep -f "Comprobantes Cinema.app/Contents/MacOS" && echo "OK: el programa se abrió"
          screencapture -x "$PWD/capturas/7_instalado_dock.png" || true
          sleep 2
          if [ -d "/Volumes/Comprobantes Cinema" ]; then echo "AVISO: el disco sigue montado"; else echo "OK: el disco se expulsó"; fi
          pkill -f "Comprobantes Cinema.app/Contents/MacOS" || true
          sleep 3
          screencapture -x "$PWD/capturas/8_dock_con_programa_cerrado.png" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-mac-${{ runner.arch }}
          path: capturas/*.png
          retention-days: 30
